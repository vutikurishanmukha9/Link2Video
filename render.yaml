services:
  - type: web
    name: link2download-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Link2Download
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        value: ""
      - key: FRONTEND_URL
        value: "https://link2download.vercel.app,http://localhost:3000"
      - key: CORS_ORIGINS
        value: '["https://link2download.vercel.app", "http://localhost:3000", "*"]'
      - key: ALLOWED_HOSTS
        value: "*"
