<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Link2Video</title>
    <meta name="theme-color" content="#0a0a0c" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #0a0a0c;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      .splash {
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        margin-bottom: 16px;
      }
      .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-top-color: #00c853;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 20px auto 0;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <img src="/logo.png" alt="Link2Video" class="logo" />
      <h2 style="font-size: 20px; font-weight: 600; margin: 0 0 6px">Link2Video</h2>
      <p style="font-size: 13px; color: #888892; margin: 0">
        Loading high-speed media downloader...
      </p>
      <div class="spinner"></div>
    </div>
    <script>
      const targetUrl = "https://link2download.vercel.app";
      if (window.location.origin !== targetUrl) {
        setTimeout(() => {
          window.location.replace(targetUrl);
        }, 300);
      }
    </script>
  </body>
</html>
