name: Build Android APK

on:
  workflow_dispatch: # Allows one-click manual trigger from GitHub Actions tab
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK Licenses & Verify Platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        working-directory: frontend
        run: |
          npm run build
          npx cap sync android

      - name: Make Gradle Executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK Output
        working-directory: frontend/android/app/build/outputs/apk/debug
        run: |
          cp app-debug.apk Link2Video-v1.0.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Link2Video-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/Link2Video-v1.0.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases (Public 1-Click Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0"
          name: "Link2Video Android App v1.0"
          body: |
            ### 📱 Link2Video Android App (Direct Download)

            **Direct 1-Click APK Download (No GitHub login required, no zip file):**
            Tap `Link2Video-v1.0.apk` below to download directly to your Android device and install!
          draft: false
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: frontend/android/app/build/outputs/apk/debug/Link2Video-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
